<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portal de Repaso 3.º DS «B» ✨</title>
  
  <!-- Fuente tipográfica Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== ESTILOS KAWAII (CSS) ===== */
    :root {
      --bg: #0d0f1d;
      --panel: #161a33;
      --pink: #ff79c6;
      --cyan: #8be9fd;
      --purple: #bd93f9;
      --yellow: #f1fa8c;
      --green: #50fa7b;
      --red: #ff5555;
      --text: #f8f8f2;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: var(--pink);
      text-align: center;
      font-size: 2.2rem;
      text-shadow: 0 0 10px rgba(255, 121, 198, 0.4);
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: var(--cyan);
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* Grilla de módulos */
    #tusMods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    /* Tarjeta Kawaii */
    .card-modulo {
      background: var(--panel);
      border: 2px solid var(--purple);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-modulo:hover {
      transform: translateY(-6px);
      border-color: var(--pink);
      box-shadow: 0 12px 24px rgba(255, 121, 198, 0.25);
    }

    .card-modulo h3 {
      color: var(--cyan);
      margin-top: 0;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    /* Botón Kawaii General */
    .btn-ver, .btn-quiz {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      box-shadow: 0 4px 10px rgba(255, 121, 198, 0.3);
      transition: all 0.2s ease;
      width: 100%;
      margin-top: 15px;
    }

    .btn-ver:hover, .btn-quiz:hover {
      filter: brightness(1.15);
      transform: scale(1.02);
    }

    /* Ventana Modal de Ficha */
    dialog {
      background: var(--panel);
      color: var(--text);
      border: 3px solid var(--pink);
      border-radius: 24px;
      max-width: 550px;
      width: 90%;
      padding: 25px;
      box-shadow: 0 0 30px rgba(255, 121, 198, 0.35);
      font-family: 'Quicksand', sans-serif;
    }

    dialog::backdrop {
      background: rgba(13, 15, 29, 0.85);
      backdrop-filter: blur(5px);
    }

    .btn-cerrar {
      background: var(--yellow);
      color: #1a1a1a;
      border: none;
      padding: 6px 14px;
      border-radius: 15px;
      cursor: pointer;
      float: right;
      font-weight: bold;
      font-family: 'Quicksand', sans-serif;
    }

    .seccion-ficha {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 12px;
    }

    .seccion-ficha h4 {
      margin: 0 0 6px 0;
      color: var(--yellow);
    }

    ul {
      padding-left: 20px;
      margin: 0;
    }

    li {
      margin-bottom: 4px;
    }

    a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== SECCIÓN DEL QUIZ INTERACTIVO ===== */
    .quiz-container {
      background: var(--panel);
      border: 2px dashed var(--pink);
      border-radius: 24px;
      padding: 25px;
      margin-top: 30px;
      box-shadow: 0 8px 20px rgba(255, 121, 198, 0.15);
    }

    .quiz-container h2 {
      color: var(--yellow);
      text-align: center;
      margin-top: 0;
    }

    .opciones-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-opcion {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--purple);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-opcion:hover:not([disabled]) {
      background: rgba(139, 233, 253, 0.15);
      border-color: var(--cyan);
    }

    /* Feedback visual de respuestas */
    .btn-opcion.correcta {
      background: rgba(80, 250, 123, 0.25) !important;
      border-color: var(--green) !important;
      color: var(--green) !important;
      font-weight: bold;
    }

    .btn-opcion.incorrecta {
      background: rgba(255, 85, 85, 0.25) !important;
      border-color: var(--red) !important;
      color: var(--red) !important;
    }

    .retroalimentacion {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }

    .retro-exito {
      background: rgba(80, 250, 123, 0.15);
      color: var(--green);
    }

    .retro-error {
      background: rgba(255, 85, 85, 0.15);
      color: var(--red);
    }
  </style>
</head>
<body>

  <h1>✨ Portal de Repaso - 3.º DS «B» ✨</h1>
  <p class="subtitle">¡El portal cobra vida con contenido real y módulo de Quiz interactivo! 🌸</p>

  <!-- 1. Tarjetas de módulos -->
  <div id="tusMods"></div>

  <!-- 2. Sección del Quiz Interactivo -->
  <section class="quiz-container">
    <h2>🎮 Quiz de Repaso Interactivo 🧠</h2>
    <div id="quizBox">
      <p id="preguntaTxt" style="font-size: 1.15rem; font-weight: bold;"></p>
      <div id="opcionesBox" class="opciones-grid"></div>
      <div id="feedbackBox"></div>
      <button id="btnSiguiente" class="btn-quiz" style="display: none;">Siguiente Pregunta ➔</button>
    </div>
  </section>

  <!-- 3. Modal para Ficha Completa -->
  <dialog id="modalFicha">
    <button id="btnCerrarModal" class="btn-cerrar">Cerrar ✕</button>
    <div id="modalDetalle"></div>
  </dialog>

  <!-- ===== LÓGICA Y DATOS (JAVASCRIPT) ===== -->
  <script>
    // Módulos reales del 3.er año
    const modulosData = [
      {
        id: "mod-30",
        nombre: "Módulo 3.0 Orientación de estudiantes al proceso educativo del tercer año",
        docente: "Prof. Javier Mineros / Arcides Canales",
        resumen: "Introducción y alineación a los objetivos educativos, metodología de trabajo y proyectos del 3.er año de bachillerato.",
        instrumentos: ["Guía de inducción", "Lista de cotejo inicial"],
        programas: ["Visual Studio Code", "Google Chrome"],
        herramientas: ["HTML5", "Git", "GitHub"],
        recursos: [
          { nombre: "MDN Web Docs", url: "https://developer.mozilla.org/es/" },
          { nombre: "Docs GitHub Pages", url: "https://docs.github.com/es/pages" }
        ]
      },
      {
        id: "mod-32",
        nombre: "Módulo 3.2 Mantenimiento y aseguramiento de la operación del sistema informático",
        docente: "Prof. Arcides Canales",
        resumen: "Diagnóstico, mantenimiento preventivo/correctivo de hardware y software, además de políticas de seguridad.",
        instrumentos: ["Ficha de diagnóstico de hardware", "Rúbrica de mantenimiento preventivo"],
        programas: ["VirtualBox", "Cisco Packet Tracer", "VS Code"],
        herramientas: ["Sistemas Operativos", "Comandos CLI", "Diagnóstico de Redes"],
        recursos: [
          { nombre: "Microsoft Learn Support", url: "https://learn.microsoft.com/es-es/" },
          { nombre: "Cisco Networking Guides", url: "https://www.netacad.com/" }
        ]
      },
      {
        id: "mod-33",
        nombre: "Módulo 3.3 Administración de Bases de Datos",
        docente: "Prof. Arcides Canales",
        resumen: "Diseño lógico y físico de bases de datos relacionales, consultas complejas y gestión de servidores BD.",
        instrumentos: ["Guía de consultas SQL", "Laboratorio de diseño relacional"],
        programas: ["MySQL Workbench", "phpMyAdmin", "VS Code"],
        herramientas: ["SQL", "DDL/DML", "Relational Model", "JSON"],
        recursos: [
          { nombre: "W3Schools SQL", url: "https://www.w3schools.com/sql/" },
          { nombre: "MySQL Documentation", url: "https://dev.mysql.com/doc/" }
        ]
      },
      {
        id: "mod-34",
        nombre: "Módulo 3.4 Elaboración de documentación de Sistemas informáticos",
        docente: "Prof. Javier Mineros",
        resumen: "Creación de manuales técnicos, manuales de usuario, diagramación UML y estándares de documentación de software.",
        instrumentos: ["Plantilla de manual de usuario", "Rúbrica de arquitectura de software"],
        programas: ["Draw.io", "Visual Studio Code", "Markdown / Word"],
        herramientas: ["UML", "Markdown", "Diagramas de Casos de Uso"],
        recursos: [
          { nombre: "MDN Markdown Cheat Sheet", url: "https://developer.mozilla.org/es/docs/MDN/Writing_guidelines/Howto/Markdown_cheat_sheet" },
          { nombre: "UML Diagrams Guide", url: "https://www.uml-diagrams.org/" }
        ]
      },
      {
        id: "mod-38",
        nombre: "Módulo 3.8 Proyecto innovador de Desarrollo de Software",
        docente: "Prof. Javier Mineros",
        resumen: "Desarrollo integral de un sistema informático aplicando metodología ágil, arquitectura cliente-servidor e innovación.",
        instrumentos: ["Bitácora de proyecto", "Rúbrica de evaluación de software completo"],
        programas: ["VS Code", "Git / GitHub", "Google Chrome"],
        herramientas: ["HTML5", "CSS3", "JavaScript ES6", "GitHub Pages"],
        recursos: [
          { nombre: "MDN Web Docs", url: "https://developer.mozilla.org/es/" },
          { nombre: "GitHub Docs", url: "https://docs.github.com/es" }
        ]
      }
    ];

    // Banco de Preguntas del Quiz
    const preguntasQuiz = [
      {
        pregunta: "1. ¿Qué módulo abarca la creación de manuales de usuario y diagramación UML?",
        opciones: ["Módulo 3.2", "Módulo 3.4", "Módulo 3.3", "Módulo 3.0"],
        correcta: 1,
        explicacion: "¡Correcto! El Módulo 3.4 aborda la Elaboración de Documentación de Sistemas e incluye diagramas UML."
      },
      {
        pregunta: "2. ¿Qué herramienta o lenguaje se utiliza para la administración de bases de datos relacionales?",
        opciones: ["CSS3", "HTML5", "SQL", "Markdown"],
        correcta: 2,
        explicacion: "¡Excelente! SQL es el lenguaje estándar utilizado para gestionar y consultar bases de datos relacionales."
      },
      {
        pregunta: "3. ¿Cuál es el comando/archivo principal exigido por GitHub Pages para publicar la web sin error 404?",
        opciones: ["inicio.html", "index.html", "main.js", "modulos.js"],
        correcta: 1,
        explicacion: "¡Así es! GitHub Pages busca estrictamente el archivo denominado index.html en minúsculas."
      }
    ];

    let preguntaActual = 0;
    let puntaje = 0;

    document.addEventListener("DOMContentLoaded", () => {
      const contenedor = document.getElementById("tusMods");
      const modal = document.getElementById("modalFicha");
      const modalDetalle = document.getElementById("modalDetalle");
      const btnCerrar = document.getElementById("btnCerrarModal");

      // Cargar Tarjetas
      function cargarModulos() {
        if (!contenedor) return;
        contenedor.innerHTML = "";
        modulosData.forEach(mod => {
          const card = document.createElement("div");
          card.className = "card-modulo";
          card.innerHTML = `
            <div>
              <h3>🎀 ${mod.nombre}</h3>
              <p><strong>Docente:</strong> ${mod.docente} 💫</p>
              <p>${mod.resumen}</p>
            </div>
            <button class="btn-ver" data-id="${mod.id}">Ver Ficha ✨</button>
          `;
          contenedor.appendChild(card);
        });

        document.querySelectorAll(".btn-ver").forEach(btn => {
          btn.addEventListener("click", (e) => {
            mostrarFicha(e.target.getAttribute("data-id"));
          });
        });
      }

      // Mostrar Ficha Modal
      function mostrarFicha(id) {
        const mod = modulosData.find(m => m.id === id);
        if (!mod) return;

        modalDetalle.innerHTML = `
          <h2>🌸 ${mod.nombre}</h2>
          <p><em>Docente: ${mod.docente} ⭐</em></p>
          <p>${mod.resumen}</p>
          <div class="seccion-ficha"><h4>📋 Instrumentos</h4><ul>${mod.instrumentos.map(i => `<li>🔹 ${i}</li>`).join("")}</ul></div>
          <div class="seccion-ficha"><h4>💻 Programas</h4><ul>${mod.programas.map(p => `<li>💖 ${p}</li>`).join("")}</ul></div>
          <div class="seccion-ficha"><h4>🛠️ Herramientas</h4><ul>${mod.herramientas.map(h => `<li>⚡ ${h}</li>`).join("")}</ul></div>
          <div class="seccion-ficha"><h4>🔗 Recursos</h4><ul>${mod.recursos.map(r => `<li>🎀 <a href="${r.url}" target="_blank" rel="noopener">${r.nombre}</a></li>`).join("")}</ul></div>
        `;
        modal.showModal();
      }

      if (btnCerrar) btnCerrar.addEventListener("click", () => modal.close());

      // LÓGICA DEL QUIZ
      const preguntaTxt = document.getElementById("preguntaTxt");
      const opcionesBox = document.getElementById("opcionesBox");
      const feedbackBox = document.getElementById("feedbackBox");
      const btnSiguiente = document.getElementById("btnSiguiente");

      function mostrarPregunta() {
        feedbackBox.innerHTML = "";
        btnSiguiente.style.display = "none";
        
        if (preguntaActual >= preguntasQuiz.length) {
          preguntaTxt.textContent = `🎉 ¡Quiz finalizado! Tu puntaje fue de ${puntaje} / ${preguntasQuiz.length}`;
          opcionesBox.innerHTML = "";
          btnSiguiente.textContent = "Reiniciar Quiz 🔄";
          btnSiguiente.style.display = "block";
          btnSiguiente.onclick = () => {
            preguntaActual = 0;
            puntaje = 0;
            btnSiguiente.textContent = "Siguiente Pregunta ➔";
            mostrarPregunta();
          };
          return;
        }

        const item = preguntasQuiz[preguntaActual];
        preguntaTxt.textContent = item.pregunta;
        opcionesBox.innerHTML = "";

        item.opciones.forEach((opc, index) => {
          const btn = document.createElement("button");
          btn.className = "btn-opcion";
          btn.textContent = opc;
          btn.onclick = () => evaluarRespuesta(index, item.correcta, item.explicacion);
          opcionesBox.appendChild(btn);
        });
      }

      function evaluarRespuesta(seleccionada, correcta, explicacion) {
        const botones = opcionesBox.querySelectorAll(".btn-opcion");
        botones.forEach(b => b.disabled = true);

        if (seleccionada === correcta) {
          botones[seleccionada].classList.add("correcta");
          feedbackBox.innerHTML = `<div class="retroalimentacion retro-exito">✨ ${explicacion}</div>`;
          puntaje++;
        } else {
          botones[seleccionada].classList.add("incorrecta");
          botones[correcta].classList.add("correcta");
          feedbackBox.innerHTML = `<div class="retroalimentacion retro-error">❌ ¡Ups! ${explicacion}</div>`;
        }

        btnSiguiente.style.display = "block";
      }

      btnSiguiente.addEventListener("click", () => {
        preguntaActual++;
        mostrarPregunta();
      });

      // Inicializar todo
      cargarModulos();
      mostrarPregunta();
    });
  </script>
</body>
</html>
