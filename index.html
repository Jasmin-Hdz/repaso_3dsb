<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Kawaii de Repaso 3.º DS «B» - v1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta Kawaii Celeste y Amarillo Pastel (Modo Oscuro Suave) */
      --bg-principal: #1a2332;
      --panel-bg: #243044;
      --panel-bg2: #2d3b54;
      --texto-principal: #f0f7ff;
      --texto-mutado: #b8cce4;
      --borde-color: #3d4f6e;
      --borde-color2: #526990;
      
      --celeste-pastel: #a5f3fc;
      --amarillo-pastel: #fef08a;
      --rosa-pastel: #fbcfe8;
      --verde-pastel: #bbf7d0;
      
      --fd: 'Fredoka', cursive, sans-serif;
      --fb: 'Quicksand', sans-serif;
      color-scheme: dark;
    }

    body.light-mode {
      /* Paleta Kawaii Celeste y Amarillo Pastel (Modo Claro) */
      --bg-principal: #f0fdfa;
      --panel-bg: #ffffff;
      --panel-bg2: #fefce8;
      --texto-principal: #334155;
      --texto-mutado: #64748b;
      --borde-color: #bae6fd;
      --borde-color2: #fef08a;
      
      --celeste-pastel: #38bdf8;
      --amarillo-pastel: #eab308;
      --rosa-pastel: #f472b6;
      --verde-pastel: #34d399;
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: var(--fb); 
      background: var(--bg-principal); 
      color: var(--texto-principal); 
      line-height: 1.6; 
      padding-bottom: 40px; 
      transition: background 0.3s, color 0.3s; 
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

    /* Navegación y Encabezado */
    nav.top { 
      position: sticky; 
      top: 0; 
      z-index: 20; 
      background: rgba(26, 35, 50, 0.9); 
      backdrop-filter: blur(10px); 
      border-bottom: 2px solid var(--borde-color); 
    }
    body.light-mode nav.top { background: rgba(240, 253, 250, 0.9); }
    nav.top .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 60px; }
    .marca { font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--celeste-pastel); }
    
    .btn-tema { 
      background: var(--amarillo-pastel); 
      border: 2px solid var(--borde-color2); 
      color: #1e293b; 
      padding: 8px 16px; 
      border-radius: 20px; 
      cursor: pointer; 
      font: 700 13px var(--fd);
      transition: transform 0.2s, filter 0.2s;
    }
    .btn-tema:hover { transform: scale(1.05); filter: brightness(1.05); }

    header { padding: 35px 0 20px; border-bottom: 2px dashed var(--borde-color); text-align: center; }
    h1 { font-family: var(--fd); font-weight: 700; font-size: clamp(26px, 4vw, 38px); margin-bottom: 10px; color: var(--celeste-pastel); }
    .badge { 
      display: inline-block; 
      background: var(--panel-bg2); 
      border: 2px solid var(--celeste-pastel); 
      color: var(--celeste-pastel); 
      border-radius: 999px; 
      padding: 4px 14px; 
      font: 600 13px var(--fd); 
      margin: 3px; 
    }

    /* Barra de Progreso */
    .seccion-progreso { 
      margin: 25px 0; 
      background: var(--panel-bg); 
      border: 2px solid var(--borde-color); 
      padding: 20px; 
      border-radius: 24px; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    .seccion-progreso h3 { font-family: var(--fd); color: var(--amarillo-pastel); }
    .barra-progreso-contenedor { 
      width: 100%; 
      background: var(--panel-bg2); 
      height: 16px; 
      border-radius: 10px; 
      overflow: hidden; 
      margin-top: 12px; 
      border: 2px solid var(--borde-color); 
    }
    .barra-progreso-llenado { 
      height: 100%; 
      width: 0%; 
      background: linear-gradient(90deg, var(--celeste-pastel), var(--amarillo-pastel)); 
      border-radius: 10px;
      transition: width 0.4s ease; 
    }

    /* Buscador y Filtros */
    .controles-busqueda { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; align-items: center; }
    .controles-busqueda input, .controles-busqueda select { 
      font: 600 15px var(--fb); 
      color: var(--texto-principal); 
      background: var(--panel-bg); 
      border: 2px solid var(--borde-color); 
      border-radius: 16px; 
      padding: 10px 16px; 
      outline: none;
    }
    .controles-busqueda input:focus, .controles-busqueda select:focus { border-color: var(--celeste-pastel); }
    .controles-busqueda input { flex: 1; min-width: 220px; }
    #contadorModulos { width: 100%; font-size: 14px; color: var(--texto-mutado); font-weight: 600; font-family: var(--fd); margin-top: -2px; }

    /* Tarjetas de Módulos */
    .grid-modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .tarjeta-modulo { 
      background: var(--panel-bg); 
      border: 2px solid var(--borde-color); 
      border-radius: 20px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      transition: transform 0.2s, border-color 0.2s;
    }
    .tarjeta-modulo:hover { transform: translateY(-4px); border-color: var(--celeste-pastel); }
    .tarjeta-modulo h3 { font-family: var(--fd); font-size: 17px; margin-bottom: 10px; line-height: 1.3; color: var(--texto-principal); }
    .tarjeta-modulo p { color: var(--texto-mutado); font-size: 14.5px; flex: 1; margin-bottom: 16px; }

    .btn-accion { 
      padding: 10px 16px; 
      background: var(--celeste-pastel); 
      color: #0f172a; 
      border: 0; 
      border-radius: 14px; 
      cursor: pointer; 
      font: 700 14px var(--fd); 
      transition: transform 0.2s, filter 0.2s;
    }
    .btn-accion:hover { transform: scale(1.02); filter: brightness(1.05); }

    /* Estilos del Quiz */
    #contenedorQuiz { margin-top: 25px; }
    .opcion-quiz { 
      display: block; 
      width: 100%; 
      padding: 12px 16px; 
      margin: 8px 0; 
      background: var(--panel-bg2); 
      border: 2px solid var(--borde-color); 
      color: var(--texto-principal); 
      border-radius: 14px; 
      cursor: pointer; 
      text-align: left; 
      font-family: var(--fb); 
      font-weight: 600;
      font-size: 14.5px; 
      transition: border-color 0.2s, background 0.2s;
    }
    .opcion-quiz:hover:not(:disabled) { border-color: var(--amarillo-pastel); }
    .opcion-quiz.correcta { background: var(--verde-pastel) !important; color: #064e3b !important; border-color: var(--verde-pastel) !important; }
    .opcion-quiz.incorrecta { background: var(--rosa-pastel) !important; color: #831843 !important; border-color: var(--rosa-pastel) !important; }
  </style>
</head>
<body>

  <nav class="top">
    <div class="wrap">
      <span class="marca">✨ Portal Repaso 3.º DS «B» · v1.0 ✨</span>
      <button id="btnTema" class="btn-tema" type="button">✨ Modo Claro/Oscuro</button>
    </div>
  </nav>

  <header>
    <div class="wrap">
      <h1>⭐ Portal Interactivo de Repaso ⭐</h1>
      <div>
        <span class="badge">📅 Jueves 5 de noviembre</span>
        <span class="badge">🚀 Versión v1.0</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Barra de Progreso Global -->
    <section class="seccion-progreso">
      <h3>📈 Progreso Global del Repaso: <span id="textoPorcentaje">0%</span></h3>
      <div class="barra-progreso-contenedor">
        <div id="barraProgreso" class="barra-progreso-llenado"></div>
      </div>
    </section>

    <!-- Buscador y Filtro -->
    <section class="controles-busqueda">
      <input type="text" id="inputBuscar" placeholder="🔍 Buscar módulo, tema o docente..." aria-label="Buscar módulos">
      <select id="filtroDocente" aria-label="Filtrar por docente">
        <option value="todos">🌟 Todos los docentes</option>
        <option value="Javier Mineros">👨‍🏫 Prof. Javier Mineros</option>
        <option value="Arcides Canales">👨‍🏫 Prof. Arcides Canales</option>
      </select>
      <p id="contadorModulos">Cargando módulos...</p>
    </section>

    <!-- Listado de Módulos -->
    <section id="contenedorModulos" class="grid-modulos"></section>

    <!-- Área interactiva para Quiz -->
    <section id="contenedorQuiz" style="display:none;" aria-live="polite"></section>
  </main>

  <script>
    // 1. DATOS REALES EXTRAÍDOS DE LOS MÓDULOS
    const modulosData = [
      {
        id: "m3_0",
        nombre: "Módulo 3.0 Orientación de estudiantes al proceso educativo del tercer año",
        docente: "Javier Mineros",
        resumen: "Introducción y lineamientos del año lectivo, metodología de trabajo y proyectos.",
        preguntas: [
          {
            q: "¿Cuál es el objetivo principal del Módulo 3.0?",
            opciones: ["Orientar al estudiante en el proceso educativo del año", "Aprender a instalar un sistema operativo", "Crear una base de datos relacional", "Diseñar una app móvil"],
            correcta: 0,
            explicacion: "El Módulo 3.0 sienta las bases del proceso educativo y de evaluación del año."
          }
        ]
      },
      {
        id: "m3_2",
        nombre: "Módulo 3.2 Mantenimiento y aseguramiento de la operación del sistema informático",
        docente: "Javier Mineros",
        resumen: "Mantenimiento preventivo, correctivo y seguridad de infraestructura tecnológica.",
        preguntas: [
          {
            q: "¿Qué abarca el aseguramiento de la operación del sistema?",
            opciones: ["Diseño de logos corporativos", "Mantenimiento, respaldo y seguridad informática", "Creación de animaciones 3D", "Edición de video"],
            correcta: 1,
            explicacion: "Garantiza que la infraestructura y los sistemas operen sin interrupciones."
          }
        ]
      },
      {
        id: "m3_3",
        nombre: "Módulo 3.3 Administración de Bases de Datos",
        docente: "Javier Mineros",
        resumen: "Gestión, optimización, consultas avanzadas y seguridad en SGBD.",
        preguntas: [
          {
            q: "¿Qué lenguaje se utiliza principalmente para administrar bases de datos relacionales?",
            opciones: ["HTML", "SQL", "CSS", "Python"],
            correcta: 1,
            explicacion: "SQL (Structured Query Language) es el estándar para consultar y administrar bases de datos."
          }
        ]
      },
      {
        id: "m3_4",
        nombre: "Módulo 3.4 Elaboración de documentación de Sistemas informáticos",
        docente: "Javier Mineros",
        resumen: "Manuales de usuario, técnicos, diagramas de arquitectura y especificación de requerimientos.",
        preguntas: [
          {
            q: "¿Por qué es crucial la documentación en un sistema informático?",
            opciones: ["Para que el sistema sea más rápido", "Facilita el mantenimiento, escalabilidad y uso por parte del usuario", "Es un requisito que no se utiliza en proyectos reales", "Reemplaza la fase de desarrollo"],
            correcta: 1,
            explicacion: "Permite que otros desarrolladores y usuarios entiendan y mantengan el sistema."
          }
        ]
      },
      {
        id: "m3_8",
        nombre: "Módulo 3.8 Proyecto innovador de Desarrollo de Software",
        docente: "Javier Mineros",
        resumen: "Formulación, desarrollo e implementación de un proyecto integrador con impacto real.",
        preguntas: [
          {
            q: "¿Qué caracteriza al proyecto del Módulo 3.8?",
            opciones: ["Es puramente teórico", "Es una solución innovadora integrando lo aprendido en el año", "Solo abarca diseño gráfico", "Es un examen escrito"],
            correcta: 1,
            explicacion: "Aplica las competencias técnicas y blandas para resolver una problemática real."
          }
        ]
      },
      {
        id: "mbtv_3_1",
        nombre: "BTVDS 3.1 Desarrollo de aplicaciones de software para la solución de problemas",
        docente: "Arcides Canales",
        resumen: "Lógica de programación, desarrollo backend/frontend y resolución algorítmica.",
        preguntas: [
          {
            q: "¿Cuál es el enfoque principal del desarrollo de aplicaciones en BTVDS 3.1?",
            opciones: ["Instalación de redes", "Resolver problemas del entorno mediante software", "Contabilidad de empresas", "Reparación de hardware"],
            correcta: 1,
            explicacion: "Diseña aplicaciones enfocadas en resolver necesidades específicas a través del código."
          }
        ]
      },
      {
        id: "m_mod2",
        nombre: "Modulo 2 Desarrollo de componentes para dispositivos móviles",
        docente: "Arcides Canales",
        resumen: "Construcción de interfaces y funcionalidades adaptadas a entornos móviles.",
        preguntas: [
          {
            q: "¿Qué aspecto es fundamental al desarrollar para dispositivos móviles?",
            opciones: ["Diseño adaptativo y optimización de recursos", "Usar solo pantallas gigantes", "Evitar el uso de táctil", "No guardar datos"],
            correcta: 0,
            explicacion: "La experiencia de usuario y el rendimiento son claves en pantallas pequeñas."
          }
        ]
      },
      {
        id: "m_mod3",
        nombre: "Modulo 3 Conversación de ingles sobre mantenimiento de sistemas informáticos",
        docente: "Arcides Canales",
        resumen: "Vocabulario técnico y comunicación verbal en inglés para soporte y tecnología.",
        preguntas: [
          {
            q: "¿Cuál es el propósito del vocabulario técnico en inglés?",
            opciones: ["Interpretar documentación, errores y comunicarse en el área IT", "Aprender literatura clásica", "Solo traducir canciones", "Ninguno"],
            correcta: 0,
            explicacion: "El inglés técnico es esencial para comprender la documentación del desarrollo de software."
          }
        ]
      },
      {
        id: "m_mod4",
        nombre: "Modulo 4 Puesta en marcha de la empresa en asociatividad cooperativa",
        docente: "Arcides Canales",
        resumen: "Modelo de negocios, cooperativismo, emprendimiento y formalización de proyectos.",
        preguntas: [
          {
            q: "¿Qué promueve la asociatividad cooperativa?",
            opciones: ["Trabajar individualmente sin compartir", "El trabajo colaborativo, la autogestión y el beneficio mutuo", "Desestimar los presupuestos", "Evitar la creación de empresas"],
            correcta: 1,
            explicacion: "Fomenta la creación de empresas bajo principios de equidad y beneficio compartido."
          }
        ]
      }
    ];

    // 2. MODO CLARO / OSCURO
    const btnTema = document.getElementById('btnTema');
    const temaGuardado = localStorage.getItem('tema');

    if (temaGuardado === 'light' || (!temaGuardado && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.body.classList.add('light-mode');
    }

    btnTema?.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const esClaro = document.body.classList.contains('light-mode');
      localStorage.setItem('tema', esClaro ? 'light' : 'dark');
    });

    // 3. BUSCADOR TOLERANTE A ACENTOS
    const inputBuscar = document.getElementById('inputBuscar');
    const filtroDocente = document.getElementById('filtroDocente');
    const contenedorModulos = document.getElementById('contenedorModulos');
    const contadorModulos = document.getElementById('contadorModulos');

    function normalizarTexto(str) {
      return str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
    }

    function renderizarModulos() {
      const textoBusqueda = normalizarTexto(inputBuscar ? inputBuscar.value : '');
      const docenteSeleccionado = filtroDocente ? filtroDocente.value : 'todos';
      const progresoGuardado = JSON.parse(localStorage.getItem('progreso_repaso') || '{}');

      const filtrados = modulosData.filter(m => {
        const coincideTexto = normalizarTexto(m.nombre).includes(textoBusqueda) ||
                              normalizarTexto(m.resumen).includes(textoBusqueda) ||
                              normalizarTexto(m.docente).includes(textoBusqueda);
        const coincideDocente = docenteSeleccionado === 'todos' || m.docente === docenteSeleccionado;
        return coincideTexto && coincideDocente;
      });

      if (!contenedorModulos) return;
      contenedorModulos.innerHTML = '';

      if (filtrados.length === 0) {
        contenedorModulos.innerHTML = '<p style="color:var(--texto-mutado); grid-column: 1/-1; text-align:center;">🌸 No se encontraron módulos que coincidan.</p>';
      } else {
        filtrados.forEach(mod => {
          const estaRepasado = progresoGuardado[mod.id] || false;
          const tarjeta = document.createElement('article');
          tarjeta.className = 'tarjeta-modulo';
          tarjeta.innerHTML = `
            <div>
              <span class="badge">🌸 ${mod.docente}</span>
              <h3 style="margin-top:10px;">${mod.nombre}</h3>
              <p>${mod.resumen}</p>
            </div>
            <div>
              <label style="cursor:pointer; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:14px;">
                <input type="checkbox" style="accent-color: var(--celeste-pastel); width:18px; height:18px;" onchange="marcarRepasado('${mod.id}', this.checked)" ${estaRepasado ? 'checked' : ''}>
                <span>Marcar como repasado</span>
              </label>
              <button class="btn-accion" style="width:100%;" onclick="lanzarQuiz('${mod.id}')">📝 Practicar Quiz</button>
            </div>
          `;
          contenedorModulos.appendChild(tarjeta);
        });
      }

      if (contadorModulos) {
        contadorModulos.textContent = `Mostrando ${filtrados.length} de ${modulosData.length} módulos`;
      }
      actualizarProgresoGlobal();
    }

    inputBuscar?.addEventListener('input', renderizarModulos);
    filtroDocente?.addEventListener('change', renderizarModulos);

    // 4. PROGRESO CON LOCALSTORAGE
    function marcarRepasado(idModulo, completado) {
      const progreso = JSON.parse(localStorage.getItem('progreso_repaso') || '{}');
      progreso[idModulo] = completado;
      localStorage.setItem('progreso_repaso', JSON.stringify(progreso));
      actualizarProgresoGlobal();
    }

    function actualizarProgresoGlobal() {
      const progreso = JSON.parse(localStorage.getItem('progreso_repaso') || '{}');
      const totalModulos = modulosData.length;
      if (totalModulos === 0) return;

      const completados = Object.keys(progreso).filter(k => progreso[k] === true).length;
      const porcentaje = Math.round((completados / totalModulos) * 100);

      const barra = document.getElementById('barraProgreso');
      const texto = document.getElementById('textoPorcentaje');

      if (barra) barra.style.width = `${porcentaje}%`;
      if (texto) texto.textContent = `${porcentaje}%`;

      if (porcentaje === 100) {
        setTimeout(() => alert('🎉 ¡Felicidades! Has completado el 100 % del repaso de todos los módulos. ✨'), 300);
      }
    }

    // 5. QUIZ INTERACTIVO
    function lanzarQuiz(idModulo) {
      const modulo = modulosData.find(m => m.id === idModulo);
      if (!modulo || !modulo.preguntas || modulo.preguntas.length === 0) {
        return alert('No hay preguntas disponibles para este módulo.');
      }

      const contenedorQuiz = document.getElementById('contenedorQuiz');
      if (!contenedorQuiz) return;
      
      contenedorQuiz.style.display = 'block';
      let html = `
        <div style="background:var(--panel-bg); border:2px solid var(--amarillo-pastel); border-radius:24px; padding:24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
          <h3 style="color:var(--amarillo-pastel); font-family:var(--fd); margin-bottom:14px; font-size:20px;">📝 Quiz: ${modulo.nombre}</h3>
      `;
      
      modulo.preguntas.forEach((p, idx) => {
        html += `
          <div style="margin-bottom:20px;">
            <p style="margin-bottom:10px; font-weight:700;"><b>${idx + 1}. ${p.q}</b></p>
            ${p.opciones.map((op, i) => `
              <button class="opcion-quiz" onclick="verificarRespuesta(this, ${i}, ${p.correcta}, '${p.explicacion.replace(/'/g, "\\'")}')">
                ${op}
              </button>
            `).join('')}
            <div class="feedback" style="margin-top:10px; font-size:14.5px; font-weight:700; font-family:var(--fd);"></div>
          </div>
        `;
      });

      html += `<button class="btn-accion" style="background:var(--amarillo-pastel); color:#1e293b;" onclick="cerrarQuiz()">✨ Cerrar Quiz</button></div>`;
      contenedorQuiz.innerHTML = html;
      contenedorQuiz.scrollIntoView({ behavior: 'smooth' });
    }

    function verificarRespuesta(boton, indiceSeleccionado, indiceCorrecto, explicacion) {
      const contenedorPregunta = boton.parentElement;
      const botones = contenedorPregunta.querySelectorAll('.opcion-quiz');
      const feedback = contenedorPregunta.querySelector('.feedback');

      botones.forEach((b, idx) => {
        b.disabled = true;
        if (idx === indiceCorrecto) b.classList.add('correcta');
      });

      if (indiceSeleccionado === indiceCorrecto) {
        feedback.style.color = 'var(--verde-pastel)';
        feedback.textContent = `✨ ¡Correcto! ${explicacion}`;
      } else {
        boton.classList.add('incorrecta');
        feedback.style.color = 'var(--rosa-pastel)';
        feedback.textContent = `💖 Incorrecto. ${explicacion}`;
      }
    }

    function cerrarQuiz() {
      const contenedorQuiz = document.getElementById('contenedorQuiz');
      if (contenedorQuiz) {
        contenedorQuiz.style.display = 'none';
        contenedorQuiz.innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', renderizarModulos);
  </script>
</body>
</html>
